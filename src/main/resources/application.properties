spring.application.name=three_token_security

server.port=11111

#logging.level.org.springframework.security=DEBUG

spring.config.import=optional:file:.env[.properties]

allowed.frontend.url=http://${HOST_SERVER_IP}:12345

app.secret.key=${APP_SECRET_KEY}

# 15 minute
access.token.expiration=${ACCESS_TOKEN_EXPIRATION}

# 30 days
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION}

# --- Refresh token cookie ---
app.cookie.refresh-name=refreshToken
app.cookie.refresh-path=/api/v1/auth/
# app.cookie.secure=true     # for production, not for dev (HTTPS only, not HTTP)
app.cookie.secure=false
app.cookie.same-site=Strict


# --- only if no nginx (and if cross-origin: frontend and backend on differed ports) ---
# --- CSRF cookie ---
# in prod: None
app.cookie.csrf-same-site=Strict
# in prod: true
app.cookie.csrf-secure=false
